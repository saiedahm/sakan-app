<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>المفضلون | سكن</title>

    <link rel="stylesheet" href="../css/home.css">

    <style>
        .page-box {
            width: min(1180px, 92%);
            margin: 40px auto 70px;
        }

        .page-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 25px;
        }

        .page-head h2 {
            margin: 6px 0;
        }

        .page-head p {
            margin: 0;
            color: #8794a5;
            font-size: 12px;
        }

        .back-btn {
            padding: 10px 16px;
            border-radius: 9px;
            border: 1px solid rgba(216,179,93,.35);
            background: transparent;
            color: #d9b85f;
            cursor: pointer;
        }

        .favorites-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .empty-box {
            padding: 70px 20px;
            text-align: center;
            border-radius: 18px;
            background: #0b192a;
            border: 1px dashed rgba(216,179,93,.2);
        }

        .empty-box .icon {
            font-size: 45px;
        }

        .empty-box h3 {
            margin: 12px 0 7px;
        }

        .empty-box p {
            margin: 0;
            color: #8794a5;
            font-size: 12px;
        }

        .remove-favorite {
            width: calc(100% - 30px);
            margin: 0 15px 15px;
            padding: 10px;
            border-radius: 9px;
            border: 1px solid rgba(190,105,105,.25);
            background: rgba(190,105,105,.05);
            color: #c99494;
            cursor: pointer;
        }

        @media (max-width: 1000px) {
            .favorites-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .favorites-grid {
                grid-template-columns: 1fr;
            }

            .page-head {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <div class="logo-area">

   <div class="logo-mark">
    <img
        src="../assets/logo/sakan-logo.png"
        alt="شعار منصة سكن">
</div>

        <div>
            <h1>سكن</h1>
            <p>المفضلون</p>
        </div>

    </div>

    <button
        type="button"
        id="backHomeBtn"
        class="header-btn"
        style="
            padding:10px 15px;
            border-radius:9px;
            border:1px solid rgba(216,179,93,.35);
            background:#0d1b2d;
            color:#d9b85f;
            cursor:pointer;
        ">

        ← الرئيسية

    </button>

</header>


<main class="page-box">

    <div class="page-head">

        <div>

            <span class="small-title">
                حسابي
            </span>

            <h2>
                الأعضاء المفضلون
            </h2>

            <p>
                الأعضاء الذين اخترتهم للمفضلة.
            </p>

        </div>

        <button
            type="button"
            class="back-btn"
            id="clearFavoritesBtn">

            مسح المفضلة

        </button>

    </div>


    <div
        id="favoritesGrid"
        class="favorites-grid">

    </div>


    <div
        id="emptyBox"
        class="empty-box"
        style="display:none;">

        <div class="icon">
            ⭐
        </div>

        <h3>
            لا يوجد أعضاء في المفضلة
        </h3>

        <p>
            عند اختيار عضو بالمفضلة سيظهر هنا.
        </p>

    </div>

</main>


<script src="../js/favorites.js"></script>

</body>
</html>
