<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اتصل بنا - منصة سكن sakanapp.net</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="contact-body">

  <div class="contact-page-wrapper">
    <div class="contact-card-box">
      <div class="contact-header">
        <a href="index.html" class="btn-back-home"><i class="fa-solid fa-arrow-right"></i> العودة للرئيسية</a>
        <h2><i class="fa-solid fa-paper-plane"></i> اتصل بإدارة منصة سكن</h2>
        <p class="contact-subtext">Ahmed Ismail Saed - Neumünster, Germany</p>
        <p class="contact-direct-mail"><i class="fa-solid fa-envelope"></i> service@sakanapp.net | info@sakanapp.net</p>
      </div>

      <form id="contact-form" onsubmit="handleContactSubmit(event)">
        <!-- المربع 1: عنوان الرسالة -->
        <div class="form-group">
          <label>1. عنوان الرسالة (Subject):</label>
          <input type="text" id="contact-subject" placeholder="أدخل موضوع الرسالة..." required>
        </div>

        <!-- المربع 2: نص الرسالة الكبير -->
        <div class="form-group">
          <label>2. نص الرسالة (Message):</label>
          <textarea id="contact-message" rows="6" placeholder="اكتب تفاصيل استفسارك هنا..." required></textarea>
        </div>

        <!-- المربع 3: البريد الإلكتروني للمرسل -->
        <div class="form-group">
          <label>3. بريدك الإلكتروني للرد عليك (Your Email):</label>
          <input type="email" id="contact-email" placeholder="example@mail.com" required>
        </div>

        <!-- المربع 4: زر الإرسال -->
        <button type="submit" class="btn-submit-gold"><i class="fa-solid fa-paper-plane"></i> 4. إرسال الرسالة إلى الإدارة</button>
      </form>
    </div>
  </div>

  <script>
    function handleContactSubmit(e) {
      e.preventDefault();
      alert('شكرًا لتواصلك مع منصة سكن (sakanapp.net).\nتم توجيه رسالتك إلى إدارة الدعم المباشر service@sakanapp.net وسيتم الرد عليك في أقرب وقت.');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
